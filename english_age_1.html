.hero-veil{
  position:absolute;inset:0;
  background:
    linear-gradient(to bottom,
      rgba(245,240,232,.90) 0%,
      rgba(245,240,232,.80) 30%,
      rgba(245,240,232,.86) 62%,
      rgba(245,240,232,.97) 88%,
      var(--cream) 100%);
}
.hero::before{content:'';position:absolute;inset:0;z-index:1;
  background-image:linear-gradient(rgba(140,115,90,.05) 1px,transparent 1px),
  linear-gradient(90deg,rgba(140,115,90,.05) 1px,transparent 1px);
  background-size:52px 52px;pointer-events:none;}
.scroll-cue{
  position:absolute;bottom:34px;left:50%;transform:translateX(-50%);
  z-index:2;display:flex;flex-direction:column;align-items:center;gap:9px;
  font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
}
.cue-line{width:1px;height:34px;background:linear-gradient(to bottom,transparent,var(--terra));
  animation:cue 1.9s ease-in-out infinite;}
@keyframes cue{0%,100%{opacity:.35;transform:scaleY(.75);}50%{opacity:1;transform:scaleY(1);}}
.hero-in{position:relative;z-index:1;max-width:620px;margin:0 auto;}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--terra);margin-bottom:24px;}
.hero h1{font-family:'Lora',serif;font-size:clamp(38px,9vw,60px);font-weight:700;line-height:1.03;letter-spacing:-.015em;margin-bottom:20px;}
.hero h1 em{font-style:italic;color:var(--terra);}
.hero-sub{font-family:'Lora',serif;font-size:clamp(17px,4.2vw,20px);line-height:1.55;color:#493A2E;margin-bottom:14px;}
.hero-note{font-size:14.5px;color:var(--muted);font-weight:300;max-width:410px;margin:0 auto 34px;}
.meta{display:flex;justify-content:center;flex-wrap:wrap;gap:10px 24px;font-size:12.5px;color:var(--muted);}
.meta span{display:flex;align-items:center;gap:7px;}
.meta span::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--terra);}

/* QUIZ */
.wrap{max-width:660px;margin:0 auto;padding:52px 22px 90px;}
.progress{margin-bottom:38px;}
.ptop{display:flex;justify-content:space-between;font-size:11.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:11px;}
.bar{height:3px;background:var(--line);border-radius:99px;overflow:hidden;}
.fill{height:100%;background:var(--terra);width:0;border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1);}

.qcard{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:42px 38px 34px;animation:up .38s ease both;}
@keyframes up{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
.qnum{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--terra);margin-bottom:15px;}
.qtext{font-family:'Lora',serif;font-size:clamp(19px,4.4vw,24px);font-weight:600;line-height:1.34;margin-bottom:10px;}
.qhint{font-size:13.5px;color:var(--muted);font-style:italic;margin-bottom:28px;}
.opts{display:flex;flex-direction:column;gap:11px;}
.opt{display:flex;gap:15px;align-items:flex-start;width:100%;text-align:left;padding:17px 19px;
  border:1.5px solid var(--line);border-radius:14px;background:#FDFBF9;cursor:pointer;
  font-family:inherit;transition:all .18s;-webkit-tap-highlight-color:transparent;}
.opt.sel{border-color:var(--terra);background:var(--terra-pale);}
.mark{width:28px;height:28px;flex-shrink:0;border:1.5px solid var(--line);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600;color:var(--muted);transition:all .18s;}
.opt.sel .mark{background:var(--terra);border-color:var(--terra);color:#fff;}
.otext{font-size:15px;line-height:1.5;}
.next{width:100%;margin-top:26px;padding:19px 30px;background:var(--terra);color:#fff;border:none;border-radius:14px;
  font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  cursor:pointer;opacity:0;pointer-events:none;transform:translateY(5px);transition:opacity .28s,transform .28s,background .2s;}
.next.on{opacity:1;pointer-events:auto;transform:none;}
.next:active{background:var(--terra-dark);}

/* RESULT — screenshot block */
.shot{background:var(--terra);color:#fff;border-radius:20px 20px 0 0;padding:44px 36px 40px;text-align:center;position:relative;overflow:hidden;}
.shot::before{content:'';position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:44px 44px;}
.shot-in{position:relative;z-index:1;}
.shot-label{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;opacity:.72;margin-bottom:18px;}
.age{font-family:'Lora',serif;font-size:clamp(76px,22vw,124px);font-weight:700;line-height:.88;letter-spacing:-.03em;margin-bottom:6px;}
.age-word{font-family:'Lora',serif;font-style:italic;font-size:clamp(20px,5vw,26px);font-weight:600;margin-bottom:22px;opacity:.95;}
.shot-line{font-family:'Lora',serif;font-size:clamp(17px,4.3vw,20px);line-height:1.45;font-weight:600;max-width:400px;margin:0 auto;}
.shot-tag{margin-top:20px;padding-top:18px;border-top:1px solid rgba(255,255,255,.22);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.6;}

.rbody{background:var(--paper);border:1px solid var(--line);border-top:none;padding:40px 38px 42px;}
.slabel{font-size:10.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--terra);margin-bottom:12px;}
.sbig{font-family:'Lora',serif;font-size:17px;line-height:1.68;color:#2C2118;margin-bottom:32px;}
.sbig b{font-weight:700;}
.hr{height:1px;background:var(--line);margin-bottom:32px;}

.cols{display:flex;flex-direction:column;gap:22px;margin-bottom:34px;}
.col-t{font-family:'Lora',serif;font-size:17px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:9px;}
.col-t .dot{width:7px;height:7px;border-radius:50%;background:var(--terra);flex-shrink:0;}
.li{font-size:14.5px;line-height:1.62;color:#34271E;padding-left:19px;position:relative;margin-bottom:8px;}
.li::before{content:'—';position:absolute;left:0;color:var(--muted);}

.grow{background:#FBF6F2;border:1px solid var(--line);border-left:3px solid var(--terra);border-radius:6px 16px 16px 6px;padding:26px 24px;}
.grow-l{font-size:10.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--terra);margin-bottom:10px;}
.grow-t{font-family:'Lora',serif;font-size:16px;line-height:1.62;color:#3A2C22;}
.grow-t b{font-weight:700;color:var(--ink);}

/* CTA */
.cta{background:var(--ink);padding:46px 38px 42px;border-radius:0 0 20px 20px;text-align:center;position:relative;overflow:hidden;}
.cta::before{content:'';position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:48px 48px;}
.cta-in{position:relative;z-index:1;}
.ceyebrow{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--terra);font-weight:600;margin-bottom:18px;}
.cta h3{font-family:'Lora',serif;font-size:clamp(24px,5.5vw,32px);font-weight:700;line-height:1.16;color:#fff;margin-bottom:16px;}
.cta h3 em{font-style:italic;color:#E8846A;}
.cta p{font-size:15px;line-height:1.6;color:rgba(255,255,255,.62);margin-bottom:14px;}
.cfacts{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 20px;margin-bottom:28px;font-size:12.5px;color:rgba(255,255,255,.45);}
.cfacts span{display:flex;align-items:center;gap:6px;}
.cfacts span::before{content:'';width:4px;height:4px;border-radius:50%;background:var(--terra);}
.btns{display:flex;flex-direction:column;gap:11px;max-width:340px;margin:0 auto;}
.btn{display:flex;align-items:center;justify-content:center;padding:19px 24px;border-radius:14px;
  font-size:12.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;text-decoration:none;transition:opacity .2s;}
.btn:active{opacity:.82;}
.bp{background:var(--terra);color:#fff;}
.bg{background:transparent;color:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.2);}
.retry{display:block;margin:26px auto 0;background:none;border:none;font-family:inherit;font-size:13px;color:var(--muted);text-decoration:underline;cursor:pointer;}

.foot{text-align:center;padding:38px 24px 46px;}
.fname{font-family:'Lora',serif;font-size:18px;font-weight:600;margin-bottom:4px;}
.frole{font-size:13px;color:var(--muted);}
.fdot{display:inline-block;width:5px;height:5px;background:var(--terra);border-radius:50%;margin-right:8px;vertical-align:middle;}

/* reveal on scroll */
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.22,.7,.3,1),transform .7s cubic-bezier(.22,.7,.3,1);}
.rv.in{opacity:1;transform:none;}
.rv-d1{transition-delay:.08s;}
.rv-d2{transition-delay:.16s;}
.rv-d3{transition-delay:.24s;}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none;}}
.hide{display:none!important;}

@media(max-width:600px){
  .qcard{padding:30px 22px 26px;}
  .shot{padding:36px 22px 32px;}
  .rbody{padding:32px 24px 34px;}
  .cta{padding:38px 24px 36px;}
  .wrap{padding:42px 16px 70px;}
}
</style>
</head>
<body>

<section class="hero">
  <div class="hero-photo"></div>
  <div class="hero-veil"></div>
  <div class="hero-in">
    <div class="eyebrow rv">Тест · 7 вопросов</div>
    <h1 class="rv rv-d1">Твой английский <em>возраст</em></h1>
    <div class="hero-sub rv rv-d2">Сколько лет было бы американцу, который говорит по-английски примерно как ты</div>
    <div class="hero-note rv rv-d2">Предупреждаю сразу: результат может задеть. Но он честный.</div>
    <div class="meta rv rv-d3">
      <span>2 минуты</span>
      <span>Без регистрации</span>
      <span>Не для слабонервных</span>
    </div>
  </div>
  <div class="scroll-cue"><span>листай</span><span class="cue-line"></span></div>
</section>

<div class="wrap">
  <div class="progress" id="prog">
    <div class="ptop"><span id="ptext">Вопрос 1 из 7</span><span id="ppct">0%</span></div>
    <div class="bar"><div class="fill" id="pfill"></div></div>
  </div>
  <div id="quiz"></div>
  <button class="next" id="next" onclick="nextQ()">Дальше →</button>
  <div id="result" class="hide"></div>
</div>

<footer class="foot">
  <div class="fname">Алина</div>
  <div class="frole"><span class="fdot"></span>репетитор английского для взрослых</div>
</footer>

<script>
const Q = [

    hint:"Только честно. Никто не видит.",
    o:[
      {t:"Понятия не имею", p:0},
      {t:"Что-то про звонок... я собирался позвонить?", p:1},
      {t:"«Я всё собирался тебе позвонить» — с оттенком вины", p:3},

    ]
  },
  {

    o:[
      {t:"Слышу отдельные слова, смысл не собирается", p:0},
      {t:"Понимаю тему, детали ускользают", p:1},
      {t:"Понимаю почти всё, если не отвлекаться", p:2},
      {t:"Понимаю всё и замечаю, как ведущий уходит от вопроса", p:3}
    ]
  },
  {
    q:"В чём разница между <b>«I made a mistake»</b> и <b>«mistakes were made»</b>?",
    hint:"Разница огромная.",
    o:[
      {t:"Ни в чём, просто разные формы", p:0},
      {t:"Второе звучит формальнее", p:1},
      {t:"Второе — способ признать ошибку, не признавая свою вину", p:3},
      {t:"Второе неправильно, так не говорят", p:0}
    ]
  },
  {
    q:"Друг пишет <b>«k»</b> в ответ на твоё длинное сообщение. Что это значит?",
    hint:"Одна буква. Много смысла.",
    o:[
      {t:"Просто «ок», он занят", p:1},
      {t:"Он обиделся или ему всё равно. Это холодно", p:3},
      {t:"Опечатка", p:0},
      {t:"Не знаю, что такое «k»", p:0}
    ]
  },
  {
    q:"Ты смотришь стендап на английском. Смеёшься?",
    hint:"Последний вопрос, самый жестокий.",
    o:[
      {t:"Смотрю только с русскими субтитрами", p:0},
      {t:"Смеюсь, когда шутка простая и очевидная", p:1},
      {t:"Смеюсь почти всегда, изредка теряю отсылку", p:2},
      {t:"Смеюсь раньше зала и понимаю игру слов", p:3}
    ]
  }
];

const R = [
  {
    max:2, age:"4", word:"года",
    line:"Ты знаешь, что собака — это dog. На этом всё.",
    tag:"уровень: меню в кафе с картинками",
    diag:"Честно? Английский лежал где-то в школьных воспоминаниях и с тех пор его никто не тревожил. Отдельные слова всплывают, но собрать из них фразу пока нечем. <b>Хорошая новость в том, что это самая быстрая точка для роста.</b> С нуля прогресс виден буквально через две недели — просто потому, что расти отсюда можно только вверх.",
    can:["Узнаёшь знакомые слова в тексте","Помнишь пару фраз со школы","Понимаешь международные слова: taxi, hotel, coffee"],
    cant:["Составить предложение самостоятельно","Понять на слух даже медленную речь","Ответить на вопрос без паузы в минуту"],
    grow:"На этом уровне <b>не нужно учить грамматику</b>. Нужно набрать первые 300 слов и научиться складывать их в короткие фразы. Всё остальное — потом."
  },
  {
    max:5, age:"7", word:"лет",
    line:"Ты понимаешь мультики. Новости — нет.",
    tag:"уровень: детский раздел Netflix",
    diag:"Ты понимаешь, когда говорят медленно, просто и с картинками. Но взрослая речь — со скоростью, сокращениями и иронией — проходит мимо. <b>Это классическое школьное наследие:</b> слова учили, а живую речь не тренировали. Поэтому в голове есть база, но она не подключена к реальности.",
    can:["Понимаешь простые фразы и медленную речь","Читаешь короткие тексты со словарём","Можешь заказать кофе, если не переспросят"],
    cant:["Поддержать разговор дольше двух реплик","Понять носителя на нормальной скорости","Выразить мысль, которая сложнее «мне нравится»"],
    grow:"Главная ловушка на этом уровне — <b>учить ещё слова вместо того, чтобы говорить</b>. Словарь уже больше, чем кажется. Не хватает практики его доставать."
  },
  {
    max:8, age:"9", word:"лет",
    line:"Ты понимаешь мультики, но не понимаешь новости.",
    tag:"уровень: смотрю с субтитрами",
    diag:"Ты уже неплохо понимаешь — пока речь простая и предсказуемая. Но там, где начинается взрослый английский (идиомы, сарказм, беглая речь, слова с двойным дном) — картинка рассыпается. <b>И самое обидное: пассивно ты знаешь гораздо больше, чем можешь сказать.</b> Разрыв между «понимаю» и «говорю» здесь максимальный.",
    can:["Понимаешь бытовые диалоги и простые видео","Читаешь и улавливаешь общий смысл","Объясняешься, если собеседник терпелив"],
    cant:["Понять новости и подкасты без напряжения","Уловить сарказм и подтекст","Говорить, не переводя в голове"],
    grow:"Здесь застревают на годы, если продолжать делать то же самое. <b>Нужно менять не объём, а тип нагрузки:</b> меньше упражнений, больше живой речи."
  },
  {
    max:11, age:"12", word:"лет",
    line:"Ты всё понимаешь. Но говоришь как в учебнике.",
    tag:"уровень: грамматика есть, души нет",
    diag:"У тебя приличная база: ты понимаешь, читаешь, строишь правильные предложения. Проблема в том, что они <b>правильные, но неживые</b>. Ты говоришь «I would like to purchase a coffee» там, где носитель скажет «can I get a coffee». Формально безупречно — и слышно за километр, что это выученный английский.",
    can:["Понимаешь фильмы и сериалы почти без субтитров","Строишь грамматически верные предложения","Ведёшь переписку на английском"],
    cant:["Звучать естественно, а не как учебник","Быстро реагировать в живом разговоре","Использовать разговорные конструкции"],
    grow:"Тебе не нужна больше грамматика. <b>Тебе нужен регистр</b> — понимание, где говорят проще, а где формально. Это набирается только из живой речи."
  },
  {
    max:14, age:"16", word:"лет",
    line:"Ты понимаешь всё. Кроме шуток и того, что не сказали вслух.",
    tag:"уровень: почти свой, но акцент выдаёт",
    diag:"Уровень уже сильный. Ты понимаешь беглую речь, читаешь без словаря, поддерживаешь разговор. Не хватает последнего слоя — <b>того, что между строк</b>. Британской вежливости, которая на самом деле отказ. Сарказма, который звучит как согласие. Шутки, построенной на игре слов. Именно эти вещи отделяют «хорошо говорит» от «свой».",
    can:["Свободно смотришь контент без субтитров","Ведёшь разговор на любую бытовую тему","Работаешь с английским, если надо"],
    cant:["Ловить весь юмор и культурные отсылки","Считывать вежливые отказы и намёки","Чувствовать себя полностью естественно в споре"],
    grow:"Дальше растут не через учебники, а через <b>погружение в культуру</b>: стендап, подкасты, разговоры о сложном. И через человека, который объяснит, что стояло за фразой."
  },
  {
    max:17, age:"25", word:"лет",
    line:"Ты говоришь как взрослый. Просто иногда думаешь по-русски.",
    tag:"уровень: почти носитель",
    diag:"Ты уверенно владеешь языком: понимаешь нюансы, шутишь, споришь, читаешь сложные тексты. Остались только следы родного языка — редкая калька, чуть другой порядок слов, интонация, которая выдаёт. <b>Это уже не про изучение, а про шлифовку.</b> И шлифуется это только в живой речи с обратной связью.",
    can:["Понимаешь юмор, сарказм и подтекст","Ведёшь сложные разговоры и споришь","Читаешь и пишешь свободно"],
    cant:["Полностью избавиться от русской логики фразы","Говорить без единой паузы на подбор слова","Всегда попадать в регистр носителя"],
    grow:"На этом уровне человек чаще всего <b>не видит собственных ошибок</b> — они слишком тонкие. Нужен кто-то, кто их слышит и называет."
  },
  {
    max:21, age:"35", word:"лет",
    line:"Ты понимаешь игру слов раньше, чем смеётся зал.",
    tag:"уровень: и что ты тут делаешь",
    diag:"Честно — этот тест тебе не нужен. Ты понимаешь подтекст, ловишь иронию, чувствуешь разницу между «bold choice» и «interesting choice». <b>Такой уровень набирается только годами живого контакта с языком</b>, а не курсами. Единственное, что реально может расти дальше — узкие области: профессиональная лексика, публичная речь, письмо.",
    can:["Понимаешь всё, включая культурный подтекст","Свободно шутишь и споришь на английском","Различаешь регистры и стили"],
    cant:["Найти в этом тесте что-то новое для себя","Оправдать, почему до сих пор не используешь язык по максимуму"],
    grow:"Вопрос уже не «как выучить», а <b>«где применять»</b>. Язык такого уровня без регулярного использования просто медленно тускнеет."
  }
];

let qi=0, sel=null, total=0;

function shuffle(a){return [...a].sort(()=>Math.random()-.5);}

function render(){
  const q=Q[qi], opts=shuffle(q.o), L=['А','Б','В','Г'];
  sel=null;
  document.getElementById('ptext').textContent=`Вопрос ${qi+1} из ${Q.length}`;
  const pct=Math.round(qi/Q.length*100);
  document.getElementById('ppct').textContent=pct+'%';
  document.getElementById('pfill').style.width=pct+'%';
  const b=document.getElementById('next');
  b.classList.remove('on');
  b.textContent = qi<Q.length-1 ? 'Дальше →' : 'Узнать возраст →';
  document.getElementById('quiz').innerHTML=`
    <div class="qcard rv">
      <div class="qnum">Вопрос ${qi+1}</div>
      <div class="qtext">${q.q}</div>
      <div class="qhint">${q.hint}</div>
      <div class="opts">
        ${opts.map((o,i)=>`<button class="opt" onclick="pick(this,${o.p})">
          <div class="mark">${L[i]}</div><div class="otext">${o.t}</div></button>`).join('')}
      </div>
    </div>`;
}

function pick(el,p){
  document.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
  el.classList.add('sel'); sel=p;
  document.getElementById('next').classList.add('on');
}

function nextQ(){
  if(sel===null) return;
  total+=sel; qi++;
  if(qi<Q.length){
    const wrap=document.querySelector('.wrap');
    const y=wrap.getBoundingClientRect().top+window.scrollY-24;
    render();
    if(window.scrollY>y) window.scrollTo({top:y,behavior:'smooth'});
  }
  else show();
}

function show(){
  document.getElementById('prog').classList.add('hide');
  document.getElementById('quiz').classList.add('hide');
  document.getElementById('next').classList.add('hide');
  const r = R.find(x=>total<=x.max) || R[R.length-1];

  document.getElementById('result').innerHTML=`
    <div class="shot rv">
      <div class="shot-in">
        <div class="shot-label">Твой английский возраст</div>
        <div class="age">${r.age}</div>
        <div class="age-word">${r.word}</div>
        <div class="shot-line">${r.line}</div>
        <div class="shot-tag">${r.tag}</div>
      </div>
    </div>

    <div class="rbody rv rv-d1">
      <div class="slabel">Что это значит</div>
      <div class="sbig">${r.diag}</div>
      <div class="hr"></div>
      <div class="cols">
        <div>
          <div class="col-t"><span class="dot"></span>Что ты уже можешь</div>
          ${r.can.map(x=>`<div class="li">${x}</div>`).join('')}
        </div>
        <div>
          <div class="col-t"><span class="dot"></span>Что пока нет</div>
          ${r.cant.map(x=>`<div class="li">${x}</div>`).join('')}
        </div>
      </div>
      <div class="grow">
        <div class="grow-l">Куда расти дальше</div>
        <div class="grow-t">${r.grow}</div>
      </div>
    </div>

    <div class="cta rv rv-d2">
      <div class="cta-in">
        <div class="ceyebrow">Следующий шаг</div>
        <h3>Хочешь <em>повзрослеть</em><br>быстрее?</h3>
        <p>На пробном уроке посмотрим, где именно у тебя провал, и соберём план — под твой возраст, а не под средний</p>
        <div class="cfacts">
          <span>40 минут</span><span>Бесплатно</span>
        </div>
        <div class="btns">
          <a class="btn bp" href="https://t.me/alinaparam" target="_blank">Записаться на пробный</a>
          <a class="btn bg" href="https://t.me/parameng" target="_blank">Подписаться на канал</a>
        </div>
      </div>
    </div>

    <button class="retry" onclick="location.reload()">Пройти заново</button>`;

  document.getElementById('result').classList.remove('hide');
  window.scrollTo({top:0,behavior:'smooth'});
}


/* ---- reveal on scroll ---- */
const io = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
  });
},{threshold:.12, rootMargin:'0px 0px -8% 0px'});

function observeNew(){
  document.querySelectorAll('.rv:not(.in)').forEach(el=>{
    const r = el.getBoundingClientRect();
    if(r.top < window.innerHeight * 0.92){
      requestAnimationFrame(()=>el.classList.add('in'));
    } else {
      io.observe(el);
    }
  });
}

const _render = render;
render = function(){ _render(); requestAnimationFrame(observeNew); };

const _show = show;
show = function(){ _show(); requestAnimationFrame(observeNew); };

render();
requestAnimationFrame(observeNew);
</script>
</body>
